<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spend Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b3a8f">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f6fc;
      --card: #fff;
      --ink: #0f1b3d;
      --mute: #6b7690;
      --blue: #1d4ed8;
      --hero: #0b3a8f;
      --green: #16a34a;
      --red: #dc2626;
      --line: #e3e9f5;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b1220;
        --card: #131c30;
        --ink: #e8eefc;
        --mute: #93a0bd;
        --blue: #5b8cff;
        --hero: #12306b;
        --line: #22304d;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0b1220;
      --card: #131c30;
      --ink: #e8eefc;
      --mute: #93a0bd;
      --blue: #5b8cff;
      --hero: #12306b;
      --line: #22304d;
    }
    * { box-sizing: border-box; }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.4 Inter, system-ui, -apple-system, Segoe UI, sans-serif;
    }
    main {
      max-width: 520px;
      margin: 0 auto;
      padding: 16px 16px 96px;
    }
    h1 { font-size: 20px; margin: 4px 0 14px; }
    small { color: var(--mute); font-size: 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .hero {
      background: var(--hero);
      color: #fff;
      border-radius: 20px;
      padding: 18px 16px 14px;
      margin-bottom: 14px;
    }
    .hero small { color: #c7d6ff; }
    .big { font-size: 32px; font-weight: 700; margin: 4px 0 10px; }
    .bar {
      height: 8px;
      border-radius: 8px;
      background: #ffffff33;
      overflow: hidden;
    }
    .bar i { display: block; height: 100%; background: #4ade80; }
    .bar.over i { background: #f87171; }
    .two { display: flex; justify-content: space-between; margin-top: 10px; }
    .hero .budget-btn {
      background: none;
      border: 0;
      color: #fff;
      font: inherit;
      padding: 0;
      text-align: left;
      cursor: pointer;
    }
    .hero .budget-btn b {
      border-bottom: 1px dashed #ffffff88;
      font-size: 15px;
    }
    .tiles {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .tile {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      text-align: left;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }
    .tile b { display: block; margin-top: 6px; }
    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .row:last-child { border: 0; }
    .em { font-size: 26px; width: 38px; text-align: center; }
    .g { flex: 1; }
    .g b, .r b { display: block; }
    .r { text-align: right; }
    .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 6px 0;
    }
    .mnav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .mnav button, .link {
      background: none;
      border: 0;
      color: var(--blue);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .mnav span { font-weight: 600; }
    .chips {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .chip {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 4px;
      text-align: center;
      font: inherit;
      font-size: 12px;
      color: var(--ink);
      cursor: pointer;
    }
    .chip span { display: block; font-size: 24px; }
    .chip.on {
      border-color: var(--blue);
      background: color-mix(in srgb, var(--blue) 12%, var(--card));
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin: 12px 0 4px;
    }
    input, select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      color: var(--ink);
      font: inherit;
    }
    .f { display: flex; gap: 8px; }
    .f > * { flex: 1; }
    .combo { position: relative; }
    .combo-list {
      position: absolute;
      left: 0; right: 0; top: calc(100% + 4px);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      max-height: 240px;
      overflow-y: auto;
      z-index: 20;
      box-shadow: 0 8px 24px #0002;
    }
    .combo-item {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }
    .combo-item:last-child { border: 0; }
    .combo-item:active { background: color-mix(in srgb, var(--blue) 10%, var(--card)); }
    .total {
      background: color-mix(in srgb, var(--blue) 10%, var(--card));
      border-radius: 12px;
      padding: 12px;
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      font-weight: 700;
    }
    .btn {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .err { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 8px; }
    .del { background: none; border: 0; color: var(--mute); font-size: 16px; cursor: pointer; }
    .up { color: var(--red); font-weight: 600; }
    .dn { color: var(--green); font-weight: 600; }
    .pill {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 20px;
      padding: 6px 12px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .pill.on { background: var(--blue); border-color: var(--blue); color: #fff; }
    .empty { text-align: center; color: var(--mute); padding: 28px 8px; }
    svg text { fill: var(--mute); font-size: 9px; }
    .leg { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 5px 0; }
    .leg i { width: 10px; height: 10px; border-radius: 3px; }
    .leg b { margin-left: auto; }
    .bi { border-bottom: 1px solid var(--line); padding: 10px 0; }
    .bi:last-child { border: 0; }
    .bi .f { margin-top: 6px; }
    .bi input, .bi select { padding: 8px 10px; }
    .bi.off { opacity: .45; }
    .warn {
      border-radius: 12px;
      padding: 10px 12px;
      margin-top: 10px;
      font-size: 13px;
      background: color-mix(in srgb, var(--red) 12%, var(--card));
      color: var(--red);
    }
    .warn.ok {
      background: color-mix(in srgb, var(--green) 12%, var(--card));
      color: var(--green);
    }
    .thumb { max-width: 100%; max-height: 220px; display: block; margin: 10px auto 0; border-radius: 10px; }
    nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--card);
      border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    nav div {
      max-width: 480px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      padding: 6px 0;
    }
    nav button {
      background: none;
      border: 0;
      color: var(--mute);
      font: inherit;
      font-size: 11px;
      cursor: pointer;
      padding: 4px;
    }
    nav button span { display: block; font-size: 20px; }
    nav button.on { color: var(--blue); font-weight: 600; }
    nav .plus {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--blue);
      color: #fff;
      font-size: 26px;
      margin: -22px auto 0;
      display: block;
      box-shadow: 0 4px 12px #1d4ed855;
    }
    .json-box {
      background: #0f172a;
      color: #38bdf8;
      padding: 10px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 11px;
      max-height: 120px;
      overflow-y: auto;
      white-space: pre-wrap;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <nav><div id="nav"></div></nav>

  <script type="module">
    import { shrinkImage, pdfToCanvas, parseWithGemini, localOcr, parseLocalText, standardizeName } from './bill-parser.mjs';

    const P = [
      ["Rent", "🏠", "Bills & Utilities"],
      ["Electricity", "⚡", "Bills & Utilities"],
      ["Mobile & Internet", "📶", "Bills & Utilities"],
      ["Subscriptions", "🔁", "Bills & Utilities"],
      ["Insurance", "🛡️", "Bills & Utilities"],
      ["Loan / EMI", "🏦", "Financial & EMI"],
      ["Other bills", "🧾", "Bills & Utilities"],
      ["Rice", "🍚", "Grains"],
      ["Toor Dal", "🫘", "Grains"],
      ["Moong Dal", "🫘", "Grains"],
      ["Urad Dal", "🫘", "Grains"],
      ["Wheat flour / Atta", "🌾", "Grains"],
      ["Maida", "🌾", "Grains"],
      ["Cooking Oil", "🛢️️", "Grocery"],
      ["Sugar", "🍬", "Grocery"],
      ["Salt", "🧂", "Grocery"],
      ["Mustard / Kadugu", "🌶️", "Grocery"],
      ["Cumin / Jeera", "🌶️", "Grocery"],
      ["Pepper / Milagu", "🌶️", "Grocery"],
      ["Spices & Masala", "🌶️", "Grocery"],
      ["Tomato", "🍅", "Vegetables"],
      ["Potato", "🥔", "Vegetables"],
      ["Onion", "🧅", "Vegetables"],
      ["Greens / Vegetables", "🥬", "Vegetables"],
      ["Banana", "🍌", "Fruits"],
      ["Apple", "🍎", "Fruits"],
      ["Milk", "🥛", "Dairy"],
      ["Curd / Ghee", "🧈", "Dairy"],
      ["Eggs", "🥚", "Dairy"],
      ["Chicken", "🍗", "Meat & fish"],
      ["Fish", "🐟", "Meat & fish"],
      ["Cinthol / Bath Soap", "🧼", "Personal care"],
      ["Shampoo / Paste", "🧴", "Personal care"],
      ["Detergent / Dishwash", "🧴", "Household"],
      ["Dining Out", "🍽️", "Dining & Outing"],
      ["Food Delivery", "🛵", "Dining & Outing"],
      ["Fuel / Petrol", "⛽", "Transport"],
      ["Transport / Auto", "🚕", "Transport"],
      ["Medicines / Pharmacy", "💊", "Healthcare"],
      ["Clothes & Footwear", "👗", "Shopping"],
      ["Education Fees", "🎒", "Education"],
      ["Miscellaneous", "🏷️", "Miscellaneous"]
    ];

    const CC = {
      "Bills & Utilities": "#0ea5e9",
      "Financial & EMI": "#ef4444",
      "Grains": "#8b5cf6",
      "Grocery": "#1d4ed8",
      "Vegetables": "#16a34a",
      "Fruits": "#f97316",
      "Dairy": "#06b6d4",
      "Meat & fish": "#ec4899",
      "Dining & Outing": "#f43f5e",
      "Transport": "#64748b",
      "Healthcare": "#10b981",
      "Household": "#eab308",
      "Personal care": "#a855f7",
      "Shopping": "#fb7185",
      "Education": "#3b82f6",
      "Miscellaneous": "#94a3b8"
    };

    const BC = {
      "Rent": "#0ea5e9",
      "Electricity": "#ca8a04",
      "Mobile & Internet": "#6366f1",
      "Subscriptions": "#14b8a6",
      "Insurance": "#64748b",
      "Loan / EMI": "#ef4444",
      "Other bills": "#a855f7"
    };

    const BE = {
      "Rent": "🏠",
      "Electricity": "⚡",
      "Mobile & Internet": "📶",
      "Subscriptions": "🔁",
      "Insurance": "🛡️",
      "Loan / EMI": "🏦",
      "Other bills": "🧾"
    };

    const AllC = () => ({ ...CC, ...BC });
    const UN = ["kg", "g", "L", "ml", "pcs"];

    let S = null;
    try { S = JSON.parse(localStorage.getItem("st")); } catch (e) {}
    S = S || { items: [] };
    S.items = S.items || [];
    S.prods = S.prods || [];
    S.bills = S.bills || [];
    S.budgets = S.budgets || {};
    defaultCardFields();
    if (typeof S.budget === "number" && Object.keys(S.budgets).length === 0) {
      const curMo = new Date().toISOString().slice(0, 7);
      S.budgets[curMo] = S.budget;
    }
    S.defaultBudget = S.defaultBudget || S.budget || 25000;
    S.geminiKey = S.geminiKey || "";
    S.userName = S.userName || "";

    const raw = () => { try { localStorage.setItem("st", JSON.stringify(S)); } catch (e) {} };
    const save = () => { S.upd = Date.now(); raw(); if (tok) { clearTimeout(timer); timer = setTimeout(sync, 2500); } };
    const $ = s => document.querySelector(s);
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const fm = n => "₹" + (+(+n).toFixed(2)).toLocaleString("en-IN");
    const df = d => new Date(d + "T00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
    const allP = () => [...P, ...S.prods.map(p => [p.name, p.emo, p.cat, p.unit])];
    // Every product name known to the app (chip list + custom products + names already saved in history).
    // Used to keep names identical across stores so the Price tracker can compare them.
    const knownList = () => [...allP(), ...S.items.map(i => [i.name, "", i.cat])];
    const stdName = n => standardizeName(n, knownList());
    const kpList = () => `<datalist id="kp">${[...new Set(knownList().map(p => p[0]))].map(n => `<option value="${esc(n)}">`).join("")}</datalist>`;
    const emo = n => (allP().find(p => p[0].toLowerCase() == String(n).toLowerCase()) || [0, "🛒"])[1];
    const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
    const ymd = d => new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
    const addDays = (ds, n) => { const d = new Date(ds + "T00:00"); d.setDate(d.getDate() + n); return ymd(d); };
    const opts = (a, x) => a.map(o => `<option ${o == x ? "selected" : ""}>${esc(o)}</option>`).join("");

    const getBudgetForMonth = m => (S.budgets && typeof S.budgets[m] === "number") ? S.budgets[m] : (S.defaultBudget || 25000);

    let v = "home", mo = today().slice(0, 7), bMo = today().slice(0, 7), sel = null, editId = null, B = null;
    let repType = "month", repAnchor = today(), repFrom = null, repTo = null;
    // Which billing cycle each card's "Manage Credit Cards" entry is currently showing/
    // editing, keyed by card id. A statement only exists once its cycle has closed, so
    // by the time the user has the number in hand "today" usually already belongs to the
    // NEXT cycle - defaulting to today's cycle (as this used to) attributed the amount to
    // the wrong one. Left unset, cardCycleStartFor() below falls back to the most recently
    // CLOSED cycle, which is what the user actually has a statement for most of the time;
    // shiftCardCycle()/jumpCardCycle() let them navigate to any other cycle explicitly.
    let cardCycleSel = {};

    const inMo = m => S.items.filter(i => i.date.startsWith(m)).sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
    const sum = a => a.reduce((s, i) => s + i.total, 0);
    const row = i => `<div class="row"><span class="em">${emo(i.name)}</span><div class="g"><b>${esc(i.name)}</b><small>${i.qty} ${i.unit} · ${fm(i.price)}/${i.unit}${i.store ? " · " + esc(i.store) : ""}</small></div><div class="r"><b>${fm(i.total)}</b><small>${df(i.date)}</small></div></div>`;
    const shift = d => { const [y, m] = mo.split("-").map(Number); const n = new Date(y, m - 1 + d, 1); mo = n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0"); go(v); };
    const mnav = () => `<div class="mnav"><button onclick="window.shift(-1)">‹</button><span>${new Date(mo + "-01T00:00").toLocaleDateString("en-IN", { month: "long", year: "numeric" })}</span><button onclick="window.shift(1)">›</button></div>`;
    const empty = t => `<div class="empty">${t}</div>`;

    function discardBill() {
      B = null;
      go('bill');
    }

    // The bill-scan verification screen's fields are edited via these instead of
    // inline "B.x = ..." attribute handlers: B lives in the module's scope, which
    // an inline onclick/onchange/oninput attribute can't see (it runs in plain
    // global scope), so a direct assignment there would silently throw and never
    // actually update the staged bill.
    function setBField(f, v) { if (B) B[f] = v; }
    function delBillItem(k) { if (B) { B.items.splice(k, 1); go("bill"); } }
    function addBillItem() { if (B) { B.items.push({ name: "", qty: 1, unit: "pcs", amount: NaN, category: "Grocery", cat: "Grocery", on: true }); go("bill"); } }

    window.go = go;
    window.shift = shift;
    window.editItem = editItem;
    window.del = del;
    window.eTot = eTot;
    window.saveEdit = saveEdit;
    window.pick = pick;
    window.tot = tot;
    window.addP = addP;
    window.saveSettings = saveSettings;
    window.bs = bs;
    window.bt = bt;
    window.addBatchBill = addBatchBill;
    window.discardBill = discardBill;
    window.handleBillUpload = handleBillUpload;
    window.pf = pf;
    window.addProd = addProd;
    window.delProd = delProd;
    window.shiftRep = shiftRep;
    window.bfC = bfC;
    window.markPaid = markPaid;
    window.addBill = addBill;
    window.delBill = delBill;
    window.askNotif = askNotif;
    window.gIn = gIn;
    window.sync = sync;
    window.shiftBudgetMonth = shiftBudgetMonth;
    window.saveMonthBudget = saveMonthBudget;
    window.setBMo = setBMo;
    window.setSel = setSel;
    window.setRepType = setRepType;
    window.setRepFrom = setRepFrom;
    window.setRepTo = setRepTo;
    window.filterSel = filterSel;
    window.pickSel = pickSel;
    window.pmC = pmC;
    window.epmC = epmC;
    window.bPmC = bPmC;
    window.setBField = setBField;
    window.delBillItem = delBillItem;
    window.addBillItem = addBillItem;
    window.addCard = addCard;
    window.delCard = delCard;
    window.saveCardBill = saveCardBill;
    window.setCardCycle = setCardCycle;
    window.delCardBill = delCardBill;
    window.shiftCardCycle = shiftCardCycle;
    window.jumpCardCycle = jumpCardCycle;
    window.hideSelList = hideSelList;

    function setBMo(m) { bMo = m; go("budget"); }
    function setSel(x) { sel = x; stf = "all"; go("price"); }
    function setRepType(k) { repType = k; go("rep"); }
    function setRepFrom(x) { repFrom = x; go("rep"); }
    function setRepTo(x) { repTo = x; go("rep"); }

    function home() {
      const cur = today().slice(0, 7), it = inMo(cur), t = sum(it);
      const b = getBudgetForMonth(cur);
      const left = b - t, p = Math.min(100, b > 0 ? (t / b) * 100 : 0);
      const due = S.bills.filter(x => !periodPaid(x) && nextDue(x) <= addDays(today(), 2));
      const greeting = S.userName ? `Welcome back, ${esc(S.userName)}` : "Welcome back";

      return `<small>${greeting}</small><h1>Your spending</h1>
      <div class="hero">
        <small>This month's spending (${new Date(cur + "-01T00:00").toLocaleDateString("en-IN", { month: "short", year: "numeric" })})</small>
        <div class="big">${fm(t)}</div>
        <div class="bar ${left < 0 ? "over" : ""}"><i style="width:${p}%"></i></div>
        <div class="two">
          <div>
            <button class="budget-btn" onclick="setBMo('${cur}')">
              <small style="color:#c7d6ff">Monthly budget</small><br>
              <b>${fm(b)} ✎</b>
            </button>
          </div>
          <div style="text-align:right">
            <small style="color:#c7d6ff">${left < 0 ? "Over budget" : "Remaining"}</small><br>
            <b>${fm(Math.abs(left))}</b>
          </div>
        </div>
      </div>
      ${due.length ? `<div class="card" style="border-color:#f59e0b"><b>⏰ ${due.length} bill${due.length > 1 ? "s" : ""} due soon</b>${due.map(x => `<div class="row"><span class="em">${BE[x.category] || "🧾"}</span><div class="g"><b>${esc(x.name)}</b><small${nextDue(x) < today() ? ' class="up"' : ""}>${nextDue(x) < today() ? "Overdue since " + df(nextDue(x)) : nextDue(x) == today() ? "Due today" : "Due " + df(nextDue(x))}</small></div><div class="r"><b>${fm(x.amount)}</b><button class="link" style="display:block;margin-top:4px" onclick="markPaid(${x.id})">Mark paid</button></div></div>`).join("")}<button class="link" onclick="go('bills')">Manage bills</button></div>` : ""}
      <div class="tiles">
        <button class="tile" onclick="go('add')">➕<b>Add purchase</b><small>Log item manually</small></button>
        <button class="tile" onclick="go('bill')">📷<b>AI Bill Scanner</b><small>Strict OCR verification</small></button>

    function shiftBudgetMonth(d) {
      const [y, m] = bMo.split("-").map(Number);
      const n = new Date(y, m - 1 + d, 1);
      bMo = n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0");
      go('budget');
    }

    function saveMonthBudget() {
      const val = +$("#bVal").value;
      const defVal = +$("#bDefVal").value;
      if (isNaN(val) || val < 0) { $("#bErr").textContent = "Enter a valid budget amount."; return; }
      S.budgets[bMo] = val;
      if (!isNaN(defVal) && defVal > 0) S.defaultBudget = defVal;
      save();
      alert(`Budget for ${new Date(bMo + "-01T00:00").toLocaleDateString("en-IN", { month: "long", year: "numeric" })} set to ${fm(val)}!`);
      go('budget');
    }

    function budget() {
      const it = inMo(bMo);
      const spent = sum(it);
      const curB = getBudgetForMonth(bMo);
      const rem = curB - spent;
      const isCustom = S.budgets && Object.prototype.hasOwnProperty.call(S.budgets, bMo);
      const monthTitle = new Date(bMo + "-01T00:00").toLocaleDateString("en-IN", { month: "long", year: "numeric" });
      const configuredMonths = Object.keys(S.budgets || {}).sort().reverse();

      return `<h1>Monthly Budget Planner</h1>
      <div class="mnav"><button onclick="window.shiftBudgetMonth(-1)">‹</button><span>${monthTitle}</span><button onclick="window.shiftBudgetMonth(1)">›</button></div>
      <div class="card">
        <div class="two" style="margin-top:0">
          <div><small>Spent this month</small><br><b>${fm(spent)}</b></div>
          <div style="text-align:right"><small>${rem < 0 ? "Over budget" : "Remaining"}</small><br><b class="${rem < 0 ? "up" : "dn"}">${fm(Math.abs(rem))}</b></div>
        </div>
      </div>
      <div class="card">
        <b>Budget for ${monthTitle}</b>
        <small style="display:block;margin:4px 0 10px">${isCustom ? "✓ Custom budget set for this month" : "Currently using default fallback budget"}</small>

        <input id="bVal" type="number" inputmode="decimal" value="${curB}">

        <b>Configured Month Limits</b>
        ${configuredMonths.length ? configuredMonths.map(m => `
          <div class="row">
            <div class="g"><b>${new Date(m + "-01T00:00").toLocaleDateString("en-IN", { month: "short", year: "numeric" })}</b><small>Spent: ${fm(sum(inMo(m)))}</small></div>
            <div class="r"><b>${fm(S.budgets[m])}</b><button class="link" style="font-size:12px;display:block" onclick="setBMo('${m}')">Edit</button></div>

    async function handleBillUpload(file) {
      if (!file) return;
      B = { busy: true, status: "Loading image file..." };
      go("bill");
      try {
        let canvas = file.type === "application/pdf" ? await pdfToCanvas(file) : await shrinkImage(file);
        B.img = canvas.toDataURL("image/jpeg", 0.72);
        const base64Data = B.img.split(",")[1];

        let parsedJson;
        if (S.geminiKey) {
          try {
            parsedJson = await parseWithGemini(base64Data, S.geminiKey, knownList(), today(), st => {
              B.status = st;
              const el = $("#bstatus");
              if (el) el.textContent = st;
            });
          } catch (aiErr) {
            console.warn("Gemini Vision failed, falling back to local module:", aiErr);
            B.note = "AI scan unavailable (" + (aiErr && aiErr.message ? aiErr.message : "error") + "). Used on-device OCR instead, so please review every line.";
            B.status = "Falling back to local OCR engine...";
            const el = $("#bstatus"); if (el) el.textContent = B.status;
            const text = await localOcr(canvas, st => {
              B.status = st;
              const e = $("#bstatus"); if (e) e.textContent = st;
            });
            parsedJson = parseLocalText(text, today(), knownList());
          }
        } else {
          B.status = "Interpreting bill via local OCR engine...";
          const el = $("#bstatus"); if (el) el.textContent = B.status;
          const text = await localOcr(canvas, st => {
            B.status = st;
            const e = $("#bstatus"); if (e) e.textContent = st;
          });
          parsedJson = parseLocalText(text, today(), knownList());
        }

        B.busy = false;
        B.store = parsedJson.store || "";
        B.date = parsedJson.date || today();
        B.payment = parsedJson.payment || "Cash";
        B.total = parsedJson.total || 0;
        B.items = (parsedJson.items || []).map(i => ({ ...i, on: true }));
        B.rawJson = JSON.stringify({
          store: B.store,
          date: B.date,
          total: B.total,
          payment: B.payment,
          items: B.items.map(i => ({ name: i.name, qty: i.qty, unit: i.unit, amount: i.amount, category: i.category || i.cat }))
        }, null, 2);
        go("bill");
        bt();
      } catch (err) {
        B = { busy: false, err: "Failed to read receipt: " + err.message };
        go("bill");
      }
    }

          <summary style="font-size:12px;color:var(--mute);cursor:pointer">View Structured JSON</summary>
          <div class="json-box">${esc(B.rawJson || "")}</div>

      <div class="card">
        <div class="head"><b>Scanned Items</b><small id="bn"></small></div>

          <div class="bi ${i.on ? "" : "off"}" id="bi${k}">

              <small id="bu${k}" style="text-align:right;font-weight:600"></small>

        <div class="total"><span>Sum of selected items</span><span id="bsum">₹0.00</span></div>

    function bs(k, f, x) {
      B.items[k][f] = x;
      bt();
    }

    function bt() {
      if (!B || !B.items || !$("#bsum")) return;
      const on = B.items.filter(i => i.on);
      const t = on.reduce((s, i) => s + (+i.amount || 0), 0);

      B.items.forEach((i, k) => {
        const e = $("#bu" + k);
        if (e) {
          e.textContent = i.qty > 0 && i.amount >= 0 ? `${fm(i.amount / i.qty)} / ${i.unit}` : "";
        }
      });

      $("#bsum").textContent = fm(t);
      $("#bn").textContent = `${on.length} of ${B.items.length} selected`;
      $("#badd").textContent = `Add ${on.length} item${on.length === 1 ? "" : "s"} to spending`;

      const diff = B.total ? +(t - B.total).toFixed(2) : 0;
      if (!B.total) {
        $("#bchk").innerHTML = `<div class="warn">Enter printed bill total above to verify individual item sum.</div>`;
      } else if (Math.abs(diff) <= 0.5) {
        $("#bchk").innerHTML = `<div class="warn ok">✓ Match verified: Sum of items equals bill total (${fm(B.total)})</div>`;
      } else {
        $("#bchk").innerHTML = `<div class="warn"><b>Total Mismatch:</b> Items total is ${diff < 0 ? fm(-diff) + " less" : fm(diff) + " more"} than the printed bill total (${fm(B.total)}). Check for missed items, discounts, or tax.</div>`;
      }
    }

    function addBatchBill() {
      const on = B.items.filter(i => i.on);
      if (!on.length) { $("#berr").textContent = "Select at least one item."; return; }
      if (!B.date) { $("#berr").textContent = "Please enter the bill date."; return; }
      if (on.some(i => !String(i.name).trim() || !(i.qty > 0) || !(i.amount >= 0))) {
        $("#berr").textContent = "Every selected item requires a valid name, quantity > 0, and amount.";
        return;
      }

      const t = on.reduce((s, i) => s + (+i.amount || 0), 0);
      if (B.total && Math.abs(t - B.total) > 1) {
        if (!confirm(`Warning: The items total (${fm(t)}) does not match the printed bill total (${fm(B.total)}). Do you still want to save these items?`)) {
          return;
        }
      }

      const id = Date.now();
      on.forEach((i, k) => {
        S.items.push({
          id: id + k,
          name: stdName(i.name.trim()),
          cat: i.category || i.cat || "Grocery",
          qty: i.qty,
          unit: i.unit,
          price: +(i.amount / i.qty).toFixed(2),
          total: +i.amount,
          date: B.date,
          pay: B.payment || "Cash",
          cardId: B.payment == "Credit Card" ? (B.cardId || "") : "",
          store: (B.store || "").trim(),
          notes: "Scanned from bill"
        });
      });

      save();
      mo = B.date.slice(0, 7);
      B = null;
      go("hist");
    }

      curSt = stores;

      const ps = pts.map(i => i.p), mx = Math.max(...ps), mn = Math.min(...ps), avg = ps.reduce((a, b) => a + b, 0) / ps.length;
      const ch = prev && prev.p ? ((last.p - prev.p) / prev.p) * 100 : null;
      const t0 = +new Date(pts[0].date), t1 = +new Date(last.date), rg = mx - mn || 1, X = d => t1 == t0 ? 160 : 36 + ((new Date(d) - t0) / (t1 - t0)) * 250, Y = p => 92 - ((p - mn) / rg) * 66;
      const svg = `<svg viewBox="0 0 310 125" width="100%" role="img" aria-label="Price history by store"><text x="30" y="${Y(mx) + 3}" text-anchor="end">${+mx.toFixed(1)}</text><text x="30" y="${Y(mn) + 3}" text-anchor="end">${+mn.toFixed(1)}</text><line x1="34" x2="300" y1="${Y(mx)}" y2="${Y(mx)}" stroke="var(--line)"/><line x1="34" x2="300" y1="${Y(mn)}" y2="${Y(mn)}" stroke="var(--line)"/>${stores.filter(x => shown.includes(x)).map(x => { const c = SC[stores.indexOf(x) % 6], a = pts.filter(i => sn(i) == x); return (a.length > 1 ? `<polyline points="${a.map(i => X(i.date) + "," + Y(i.p)).join(" ")}" fill="none" stroke="${c}" stroke-width="2.5"/>` : "") + a.map(i => `<circle cx="${X(i.date)}" cy="${Y(i.p)}" r="3.5" fill="${c}"><title>${esc(x)} · ${df(i.date)} · ${fm(i.p)}/${u}</title></circle>`).join(""); }).join("")}<text x="36" y="118">${df(pts[0].date)}</text><text x="300" y="118" text-anchor="end">${df(last.date)}</text></svg>`;
      const st = stores.map(x => { const a = it.filter(i => sn(i) == x); return { s: x, l: a[a.length - 1].p, avg: a.reduce((q, i) => q + i.p, 0) / a.length, lo: Math.min(...a.map(i => i.p)), n: a.length }; }).sort((a, b) => a.l - b.l);

      <div class="card"><div class="head"><span style="font-size:30px">${emo(sel)}</span>${ch === null ? "" : `<span class="${ch > 0 ? "up" : "dn"}">${ch > 0 ? "▲ +" : "▼ "}${ch.toFixed(1)}% vs previous buy</span>`}</div>
      <div class="two"><div><small>Latest</small><br><b>${fm(last.p)}/${u}</b></div><div><small>Lowest</small><br><b>${fm(mn)}</b></div><div><small>Average</small><br><b>${fm(avg)}</b></div><div style="text-align:right"><small>Highest</small><br><b>${fm(mx)}</b></div></div></div>
      <div class="card"><b>Price per ${u}</b>${pts.length > 1 ? svg : empty("Log this again to view comparison graph.")}${stores.length > 1 && stf == "all" ? `<div style="display:flex;gap:12px;flex-wrap:wrap">${stores.map((x, k) => `<div class="leg"><i style="background:${SC[k % 6]}"></i>${esc(x)}</div>`).join("")}</div>` : ""}</div>
      <div class="card"><b>Store comparison</b> <small>latest price per ${u}</small>${stores.length > 1 ? st.map((x, k) => `<div class="row"><i style="width:10px;height:10px;border-radius:3px;background:${SC[stores.indexOf(x.s) % 6]}"></i><div class="g"><b>${esc(x.s)}</b><small>Avg ${fm(x.avg)} · Low ${fm(x.lo)} · ${x.n} buy${x.n > 1 ? "s" : ""}</small></div><div class="r"><b>${fm(x.l)}</b><small class="${k ? "up" : "dn"}">${k ? "+" + fm(x.l - st[0].l) + " vs cheapest" : "Cheapest"}</small></div></div>`).join("") : empty("Log from multiple stores to compare.")}</div>

    // --- Manage Credit Cards screen ---
    function defaultCardFields() {
      S.cards = S.cards || [];
      S.cards.forEach(c => { if (!c.cycleDay) c.cycleDay = 1; });
      S.cardBills = S.cardBills || [];
      // Older entries were saved as a plain "YYYY-MM" calendar month, back when every
      // card implicitly billed on the 1st - that's exactly what cycleDay defaults to
      // above, so "YYYY-MM-01" is the correct, lossless equivalent cycle-start date.
      S.cardBills.forEach(cb => { if (!cb.cycleStart && cb.month) { cb.cycleStart = cb.month + "-01"; delete cb.month; } });
    }

    // The [start, end] (inclusive, ymd strings) of the billing cycle that contains
    // date `d`, for a card whose cycle starts on day `cycleDay` of each month.
    function cycleRange(cycleDay, d) {
      const day = Math.max(1, Math.min(28, cycleDay || 1));
      const dt = new Date(d + "T00:00");
      let y = dt.getFullYear(), m = dt.getMonth();
      if (dt.getDate() < day) { m--; if (m < 0) { m = 11; y--; } }
      const start = new Date(y, m, day);
      const end = new Date(y, m + 1, day);
      end.setDate(end.getDate() - 1);
      return [ymd(start), ymd(end)];
    }

    const cardSpendInCycle = (cardId, s, e) => S.items.filter(i => i.cardId == cardId && i.date >= s && i.date <= e).reduce((sum, i) => sum + i.total, 0);

    // The canonical start date of the cycle `n` whole cycles away from the cycle
    // containing `anchorYmd` (n can be negative). Re-derives the cycle containing
    // anchorYmd first via cycleRange (so a stale or non-canonical anchor - e.g. an old
    // cycleStart left over from before the card's cycleDay was changed - still lands in
    // the right cycle) before stepping by whole months; cycleDay is always <=28, so
    // adding/subtracting months never overflows into the wrong month.
    function cycleStartShift(cycleDay, anchorYmd, n) {
      const day = Math.max(1, Math.min(28, cycleDay || 1));
      const [cs] = cycleRange(day, anchorYmd);
      const d = new Date(cs + "T00:00");
      return ymd(new Date(d.getFullYear(), d.getMonth() + n, day));
    }

    // Most recently CLOSED cycle's start - the default cycle to show/edit, since a
    // statement is only available once its cycle has ended.
    function defaultCardCycleStart(c) {
      const [todayCs] = cycleRange(c.cycleDay, today());
      return cycleStartShift(c.cycleDay, todayCs, -1);
    }

    function cardCycleStartFor(c) {
      return cardCycleSel[c.id] || defaultCardCycleStart(c);
    }

    function shiftCardCycle(id, n) {
      const c = S.cards.find(x => x.id == id);
      if (!c) return;
      const [todayCs] = cycleRange(c.cycleDay, today());
      let next = cycleStartShift(c.cycleDay, cardCycleStartFor(c), n);
      if (next > todayCs) next = todayCs; // the cycle in progress is as far forward as there's anything to show
      cardCycleSel[id] = next;
      go('cards');
    }

    function jumpCardCycle(id, cycleStart) {
      cardCycleSel[id] = cycleStart;
      go('cards');
    }

    function addCard() {

      if (!n) { $("#cerr").textContent = "Enter a card name."; return; }

      S.cards.push({ id: Date.now(), name: n, last4: l4, cycleDay: cd });
      save();
      go("cards");
    }

    function delCard(id) {
      if (!confirm("Delete this card? Past purchases logged against it keep their record but will no longer count toward any card's cycle tally.")) return;
      S.cards = S.cards.filter(c => c.id != id);
      S.cardBills = S.cardBills.filter(cb => cb.cardId != id);
      save();
      go("cards");
    }

    function setCardCycle(id) {
      const el = $("#ccy" + id), c = S.cards.find(x => x.id == id);
      if (!c) return;
      c.cycleDay = Math.max(1, Math.min(28, +el.value || 1));
      save();
      go("cards");
    }

    function saveCardBill(cardId) {
      const el = $("#cb" + cardId), c = S.cards.find(x => x.id == cardId);
      if (!c) return;
      const amt = +el.value;
      if (!(amt >= 0)) { el.focus(); return; }
      // Save against whichever cycle is currently selected/navigated to (see
      // cardCycleStartFor above) - NOT always "today's" cycle, since by the time a
      // statement is in hand its cycle has usually already closed and a new one begun.
      const cs = cardCycleStartFor(c);
      const existing = S.cardBills.find(cb => cb.cardId == cardId && cb.cycleStart == cs);
      if (existing) { existing.amount = amt; existing.date = today(); }
      else S.cardBills.push({ id: Date.now(), cardId, cycleStart: cs, amount: amt, date: today() });
      save();
      go("cards");
    }

    function delCardBill(id) {
      S.cardBills = S.cardBills.filter(cb => cb.id != id);

    function cards() {

          <small style="display:block;margin:-4px 0 10px;color:var(--mute)">${isCurrent ? "This cycle is still open - come back once your statement is generated, or go back one cycle (‹) to enter the one you just got." : isDefault ? "Most recently closed cycle - usually the one your latest statement is for." : "Browsing an earlier cycle."}</small>

    function periodRange(type, anchor) {
      const d = new Date(anchor + "T00:00");
      if (type == "day") return [anchor, anchor];
      if (type == "week") {
        const dow = d.getDay(), s = new Date(d);
        s.setDate(d.getDate() - dow);
        const e = new Date(s);
        e.setDate(s.getDate() + 6);
        return [ymd(s), ymd(e)];
      }
      if (type == "year") return [d.getFullYear() + "-01-01", d.getFullYear() + "-12-31"];
      const y = d.getFullYear(), m = d.getMonth();
      return [ymd(new Date(y, m, 1)), ymd(new Date(y, m + 1, 0))];
    }

    function prevRange(type, cur, anchor) {
      if (type == "custom") {
        const len = (new Date(cur[1]) - new Date(cur[0])) / 864e5 + 1;
        return [addDays(cur[0], -len), addDays(cur[1], -len)];
      }
      const d = new Date(anchor + "T00:00");
      if (type == "day") d.setDate(d.getDate() - 1);
      else if (type == "week") d.setDate(d.getDate() - 7);
      else if (type == "year") d.setFullYear(d.getFullYear() - 1);
      else d.setMonth(d.getMonth() - 1, 1);
      return periodRange(type, ymd(d));
    }

    function rangeLabel(type, cur, anchor) {
      if (type == "day") return df(cur[0]);
      if (type == "week") return df(cur[0]) + " – " + df(cur[1]);
      if (type == "year") return String(new Date(anchor + "T00:00").getFullYear());
      if (type == "month") return new Date(anchor + "T00:00").toLocaleDateString("en-IN", { month: "long", year: "numeric" });
      return df(cur[0]) + " – " + df(cur[1]);
    }

    const inRange = r => S.items.filter(i => i.date >= r[0] && i.date <= r[1]);

    function shiftRep(n) {
      if (repType == "custom") {
        const len = (new Date(repTo || today()) - new Date(repFrom || today())) / 864e5 + 1;
        repFrom = addDays(repFrom || today(), n * len);
        repTo = addDays(repTo || today(), n * len);
        return go("rep");
      }
      const d = new Date(repAnchor + "T00:00");
      if (repType == "day") d.setDate(d.getDate() + n);

    function paidToday(b) {

    function periodPaid(b) {
      if (b.freq == "daily") return paidToday(b);
      const type = b.freq == "weekly" ? "week" : b.freq == "yearly" ? "year" : "month";
      const [s, e] = periodRange(type, today());

    function nextDue(b) {
      const t = today();
      if (b.freq == "daily") return t;
      const paid = periodPaid(b);
      if (b.freq == "weekly") {
        const d = new Date(t + "T00:00");
        const back = (d.getDay() - b.day + 7) % 7;
        const cur = new Date(d);
        cur.setDate(d.getDate() - back);
        if (!paid) return ymd(cur);
        const nxt = new Date(cur);
        nxt.setDate(cur.getDate() + 7);
        return ymd(nxt);
      }
      if (b.freq == "yearly") {
        const y = new Date(t + "T00:00").getFullYear();
        const dim = new Date(y, b.month, 0).getDate();
        const curDue = y + "-" + String(b.month).padStart(2, "0") + "-" + String(Math.min(b.day, dim)).padStart(2, "0");
        if (!paid) return curDue;
        const y2 = y + 1, dim2 = new Date(y2, b.month, 0).getDate();
        return y2 + "-" + String(b.month).padStart(2, "0") + "-" + String(Math.min(b.day, dim2)).padStart(2, "0");
      }
      const dNow = new Date(t + "T00:00"), y = dNow.getFullYear(), m = dNow.getMonth() + 1;
      const dim = new Date(y, m, 0).getDate();
      const curDue = y + "-" + String(m).padStart(2, "0") + "-" + String(Math.min(b.day, dim)).padStart(2, "0");
      if (!paid) return curDue;
      let m2 = m + 1, y2 = y;
      if (m2 > 12) { m2 = 1; y2++; }
      const dim2 = new Date(y2, m2, 0).getDate();
      return y2 + "-" + String(m2).padStart(2, "0") + "-" + String(Math.min(b.day, dim2)).padStart(2, "0");

    function gInit() {

        callback: r => {

    function go(x) {

      // instead of immediately exiting - this matters even more once the app is
      // installed/packaged, where a back gesture is the main way to leave a screen.
      // Calls that just re-render the SAME screen after a data change (most go(v)
      // calls throughout this file) don't push a redundant history entry.
      if (!history.state || history.state.page !== x) history.pushState({ page: x }, "", "");
      render(x);
    }

    // A lone history entry for Home isn't enough to ask before exiting: popstate
    // only fires for same-document navigation, so the back press that would leave
    // Home entirely (nothing left in this page's history) exits straight away
    // without ever giving JS a chance to intervene. The fix is to always keep one
    // extra "floor" entry underneath Home - so that exit-from-home back press lands
    // on the floor instead (a same-document popstate we CAN catch), where a confirm
    // is shown; declining re-arms the floor by pushing Home again, and confirming
    // lets the following history.back() actually leave (closing the app/tab, or
    // returning to whatever was open before it, same as a normal exit).
    addEventListener("popstate", e => {
      const state = e.state;
      if (state && state.floor) {
        if (confirm("Exit Spend Tracker?")) history.back();
        else { history.pushState({ page: "home" }, "", ""); render("home"); }
        return;
      }
      render((state && state.page) || "home");
    });

    history.replaceState({ page: "home", floor: true }, "", "");
    history.pushState({ page: "home" }, "", "");
    render("home");
    checkReminders();
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState == "visible") {
        checkReminders();
        autoAuthenticate();
      }
    });
  </script>
</body>
</html>
